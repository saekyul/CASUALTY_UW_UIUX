version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: casualty_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casualty_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casualty_password}
      POSTGRES_DB: ${POSTGRES_DB:-casualty_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - casualty_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casualty_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casualty_backend_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-casualty_user}:${POSTGRES_PASSWORD:-casualty_password}@postgres:5432/${POSTGRES_DB:-casualty_db}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET}
      OUTLOOK_TENANT_ID: ${OUTLOOK_TENANT_ID}
      ENV: production
      DEBUG: false
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - casualty_network_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casualty_frontend_prod
    environment:
      REACT_APP_API_URL: ${BACKEND_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - casualty_network_prod

  nginx:
    image: nginx:alpine
    container_name: casualty_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - casualty_network_prod

volumes:
  postgres_data_prod:
    driver: local

networks:
  casualty_network_prod:
    driver: bridge
